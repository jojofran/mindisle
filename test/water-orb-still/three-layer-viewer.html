<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MindIsle 水球 2.5D 静止图层预览</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, sans-serif; background: #eef4f6; }
    html, body { margin: 0; min-height: 100%; background: #eef4f6; }
    body { display: grid; place-items: center; }
    #stage { width: min(100vw, 853px); height: min(100vh, 1844px); aspect-ratio: 853 / 1844; position: relative; overflow: hidden; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    #orbHit { position: absolute; border: 0; padding: 0; border-radius: 50%; background: transparent; cursor: pointer; }
    #orbHit:focus-visible { outline: 2px solid rgba(63, 126, 137, .8); outline-offset: 4px; }
    #status { position: absolute; left: 12px; bottom: 10px; margin: 0; padding: 4px 7px; color: rgba(35, 74, 80, .72); background: rgba(255,255,255,.36); border-radius: 6px; font: 11px/1.3 ui-monospace, SFMono-Regular, monospace; }
  </style>
</head>
<body>
  <main id="stage" aria-label="水球静止状态预览">
    <button id="orbHit" type="button" aria-label="水球命中区域"></button>
    <p id="status">loading</p>
  </main>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.180.0/build/three.module.js"}}
  </script>
  <script type="module" src="./three-layer-viewer.js"></script>
</body>
</html>
