<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindIsle WaterBall · K2 内部层次视差</title>
<style>
:root{color-scheme:light;--ink:#183b45;--muted:#5f7b82;--line:#d7e7e9;--accent:#277b88;--panel:#f2f8f8}*{box-sizing:border-box}body{margin:0;background:#eef6f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1080px;margin:0 auto;padding:30px 20px 56px}h1{margin:0 0 8px;font-size:28px}.lead{max-width:900px;color:var(--muted);line-height:1.7}.rule{border-left:3px solid var(--accent);background:#fff;padding:13px 16px;border-radius:0 10px 10px 0;line-height:1.65;margin:16px 0}.layout{display:grid;grid-template-columns:420px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.card h2{font-size:17px;margin:2px 0 8px}.card p{font-size:13px;color:var(--muted);line-height:1.55}.card img,.card canvas{display:block;width:100%;aspect-ratio:1;border-radius:10px;background:#9aa6aa}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls button{border:1px solid #bdd9dc;background:#fff;border-radius:999px;padding:8px 12px;color:var(--ink);cursor:pointer}.controls button.active{background:var(--accent);border-color:var(--accent);color:#fff}.range{display:grid;grid-template-columns:100px 1fr 62px;gap:8px;align-items:center;margin:13px 0}.range input{width:100%}.status{display:inline-block;padding:6px 10px;border-radius:999px;background:#e8f7f8;color:#155c65;font-size:13px}.mono{white-space:pre-wrap;background:var(--panel);border-radius:9px;padding:12px;margin-top:12px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#42646b}.decision{border-left:3px solid var(--accent);padding-left:12px;line-height:1.65;color:var(--muted)}@media(max-width:820px){.layout{grid-template-columns:1fr}}
</style>
</head><body><main>
<h1>下一步：让水的内部层次一起变化</h1>
<p class="lead">上一轮完整字段外观已经通过。这一页把厚度、密度用于不同区域的轻微位移，外壳和两个光点保持固定。镜头没有旋转，这是固定视角的动态 2.5D 实验。</p>
<section class="layout"><div class="card"><h2>只看这个球</h2><canvas id="gpu" width="360" height="360"></canvas>
<div class="controls"><button id="play">播放内部变化</button><button id="pause">暂停</button><button id="reset">回到静态基线</button></div>
<div class="range"><label for="parallax">内部层次位置</label><input id="parallax" type="range" min="-1" max="1" step=".001" value="0"><span id="parallaxValue">0.000</span></div>
<div class="controls" id="backgrounds"><button data-bg="light" class="active">浅色</button><button data-bg="dark">深色</button><button data-bg="split">分屏</button><button data-bg="checker">棋盘</button></div>
<p id="status" class="status">正在加载独立视差字段…</p></div>
<div class="card"><h2>我负责检查技术，你只看变化是否自然</h2>
<p>点击“播放内部变化”，看上面这一个球。</p>
<p>1. 球体是否一直完整？<br>2. 两个光点是否固定、周围没有多余膜？<br>3. 里面是否像同一团水缓慢变化？</p>
<p>无需检查字段名或数字。这轮的技术检查会由我完成；视觉裁决沿用“是 / 否 / 看不出来”。</p>
<div class="controls"><button class="answer" data-answer="是">是，三项都自然</button><button class="answer" data-answer="否">否，有明显问题</button><button class="answer" data-answer="看不出来">看不出来</button></div>
<textarea id="note" aria-label="裁决备注" placeholder="可选：告诉我哪处不自然" style="width:100%;min-height:65px;border:1px solid #bdd9dc;border-radius:9px;padding:10px"></textarea>
<div class="controls"><button id="copy">复制裁决文本</button></div><div id="result" class="mono">尚未选择。</div>
<details><summary>技术检查（无需你审核）</summary><button id="quality">运行检查</button><div id="params" class="mono"></div><div id="qualityResult" class="mono">尚未运行</div></details>
</div></section>
<p class="lead"><a href="k2-complete-field-study.html">已通过的静态对照</a> · <a href="k2-parallax-field/k2-parallax-field.json">独立字段记录</a></p>
</main><script src="k2-parallax-study.js"></script></body></html>
