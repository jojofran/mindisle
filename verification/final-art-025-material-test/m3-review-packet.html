<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MindIsle WaterBall · M3 review packet</title>
<style>
:root{color-scheme:light;--ink:#183b45;--muted:#5f7b82;--line:#d7e7e9;--accent:#277b88;--panel:#f2f8f8}*{box-sizing:border-box}body{margin:0;background:#eef6f7;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1120px;margin:0 auto;padding:28px 20px 52px}h1{margin:0 0 8px;font-size:28px}.lead{color:var(--muted);line-height:1.7;max-width:920px}.rule{border-left:3px solid var(--accent);background:#fff;padding:13px 16px;border-radius:0 10px 10px 0;line-height:1.65;margin:16px 0}.review{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.review h2{margin:0 0 8px;font-size:18px}.questions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.q{border:1px solid var(--line);border-radius:10px;padding:12px;line-height:1.6;color:var(--muted)}.q strong{display:block;color:var(--ink);margin-bottom:4px}.stage{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:16px}.stage iframe{display:block;width:100%;height:760px;border:0;border-radius:10px;background:#eef6f7}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid #bdd9dc;background:#fff;border-radius:999px;padding:9px 14px;color:var(--ink);cursor:pointer}.actions button.active{background:var(--accent);border-color:var(--accent);color:#fff}textarea{width:100%;min-height:70px;border:1px solid #bdd9dc;border-radius:9px;padding:10px;margin-top:10px}.mono{white-space:pre-wrap;background:var(--panel);border-radius:9px;padding:12px;margin-top:12px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#42646b}@media(max-width:760px){.questions{grid-template-columns:1fr}.stage iframe{height:680px}}
</style></head><body><main>
<h1>M3 · 只审这一页</h1>
<p class="lead">下面只有一个合成水球：连续内部输运和受限视角 source 已经合在一起。技术检查已完成，你只需要判断视觉是否自然。</p>
<div class="rule"><strong>请先点击合成页里的“播放合成变化”，再看这个球。</strong>不需要看数字，也不需要理解字段。</div>
<section class="review"><h2>三道裁决题</h2><div class="questions"><div class="q"><strong>1 · 球体完整</strong>播放和拖动时，球有没有被拉坏或出现多余膜？</div><div class="q"><strong>2 · 内部独立</strong>变化是否主要发生在内部，外壳、核和光点是否稳定？</div><div class="q"><strong>3 · 水感连续</strong>连续进度和小范围视角变化，是否像同一团水？</div></div><p class="lead">三题都可以，就选 PASS_REVIEW；任意一题明显不对，就选 REVISE_VISUAL。</p><div class="actions"><button data-verdict="PASS_REVIEW">PASS_REVIEW</button><button data-verdict="REVISE_VISUAL">REVISE_VISUAL</button><button id="copy">复制裁决文本</button></div><textarea id="note" aria-label="裁决备注" placeholder="可选：只写最明显的问题"></textarea><div id="result" class="mono">尚未选择裁决。</div></section>
<section class="stage"><iframe title="M3 合成连续 2.5D" src="m3-k2-combined-2p5d-study.html?embedded=1"></iframe></section>
<p class="lead"><a href="k2-endpoint-gate.json">查看 K2 gate</a> · <a href="m3-k2-combined-2p5d-evidence.json">查看技术证据</a></p>
</main><script>
let verdict='';const note=document.getElementById('note'),result=document.getElementById('result');function text(){return `M3 合成连续 2.5D 裁决\nVERDICT=${verdict||'HOLD'}\n1 球体完整：${verdict==='PASS_REVIEW'?'是':'待定'}\n2 只动内部：${verdict==='PASS_REVIEW'?'是':'待定'}\n3 像同一团水：${verdict==='PASS_REVIEW'?'是':'待定'}\n备注：${note.value.trim()||'（未补充备注）'}`}document.querySelectorAll('[data-verdict]').forEach(button=>button.onclick=()=>{verdict=button.dataset.verdict;document.querySelectorAll('[data-verdict]').forEach(x=>x.classList.toggle('active',x===button));result.textContent=text()});document.getElementById('copy').onclick=async()=>{if(!verdict)return;result.textContent=text();try{await navigator.clipboard.writeText(result.textContent)}catch{result.textContent=text()+'\n请手动复制。'}};
</script></body></html>
