<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>心屿 · 冥想</title><link rel="stylesheet" href="components/waterball/waterball.css"><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#edf3f5;color:#315c65;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif}main{height:100svh;position:relative;isolation:isolate;overflow:hidden}.readout{position:absolute;top:20.5%;left:0;width:100%;text-align:center;pointer-events:none}.readout h1{font-size:clamp(14px,2.1vh,25px);font-weight:400;letter-spacing:.45em;margin:0 0 12px}.time{font-family:'Times New Roman',serif;font-weight:400;font-size:clamp(48px,7.4vh,105px);line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}.status{font-size:clamp(12px,1.5vh,19px);letter-spacing:.18em;color:#7b9ca4;margin-top:14px}.bottom{position:absolute;bottom:max(7%,env(safe-area-inset-bottom));width:100%;text-align:center}.bottom p{color:#88a2a7;font-size:12px;letter-spacing:.14em}.bottom button{border:0;background:transparent;color:#64818a;padding:14px;font-size:12px;cursor:pointer}.pure .readout,.pure .bottom{display:none}
</style></head><body><main><div class="waterball-host" id="orb"></div><div class="readout"><h1>冥想</h1><div class="time" id="time">25:00</div><p class="status" id="status">轻触水球，开始</p></div><div class="bottom"><p id="hint">让这一刻，只属于你</p><button id="end" hidden>结束这段时间</button></div></main><script src="components/waterball/profile.js"></script><script src="components/waterball/waterball.js"></script><script>
const params=new URLSearchParams(location.search);if(params.has('pure'))document.body.classList.add('pure');
const orb=new MindIsleWaterball(document.querySelector('#orb'),{onActivate:()=>{document.querySelector('#status').textContent='水球已触碰，保持安静';}});
function update(){const s=orb.inspect();document.querySelector('#status').textContent=s.state==='still'?'轻触水球，开始':s.state;}
 window.MINDISLE.waterOrb=orb; window.__MINDISLE__.waterOrb=orb; window.waterballDebug={read:()=>({visual:orb.inspect()}),suspend:()=>orb.suspend('debug'),resume:()=>orb.resume('debug'),reset:()=>orb.reset()};
 orb.loaded.then(()=>{update();});
</script></body></html>
